services:
  - type: web
    name: facility-portal-backend
    runtime: node
    rootDir: backend
    buildCommand: npm install --include=dev && npx tsc
    startCommand: node dist/index.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000
      - key: FRONTEND_URL
        value: https://facilities-portal-mu.vercel.app
      # Set these as Secret Files in the Render dashboard:
      # - key: MONGODB_URI
      # - key: JWT_SECRET
      # - key: JWT_EXPIRES_IN
